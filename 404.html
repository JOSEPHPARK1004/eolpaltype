<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1120">
<meta name="robots" content="noindex">
<title>없는 페이지예요 · 얼팔타입</title>
<style>
  /* 없는 주소는 어느 깊이에서 열릴지 몰라, 외부 파일 없이 이 파일 안에서만 그려요. */
  html,body{margin:0;height:100%;background:#0D1120;color:#F3EBDD;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;box-sizing:border-box}
  .mark{width:84px;height:84px;margin-bottom:20px}
  .code{font-size:13px;letter-spacing:.2em;color:#86C9B5;margin:0 0 10px}
  h1{font-size:24px;line-height:1.4;margin:0 0 10px;color:#E8CF9B}
  p{font-size:15px;line-height:1.6;margin:0 0 28px;color:#C9C3B8}
  a.btn{display:inline-block;min-width:200px;padding:15px 24px;border-radius:14px;background:#D6B579;color:#0D1120;font-weight:700;text-decoration:none;font-size:16px}
  a.btn:focus-visible{outline:2px solid #86C9B5;outline-offset:3px}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 14 A28 36 0 0 0 50 86" fill="none" stroke="#D6B579" stroke-width="8" stroke-linecap="round"/><g stroke-linecap="round" stroke-width="8" fill="none"><path d="M57 27 H70.5" stroke="#D6B579"/><path d="M57 50 H77" stroke="#86C9B5"/><path d="M57 73 H64" stroke="#D6B579"/></g><circle cx="39" cy="41" r="4.6" fill="#86C9B5"/></svg>
  <p class="code">404</p>
  <h1>없는 페이지예요</h1>
  <p>주소가 바뀌었거나 잘못 입력됐을 수 있어요.<br>처음 화면에서 다시 시작해 주세요.</p>
  <a class="btn" id="home" href="./">처음으로</a>
</main>
<script>
  // github.io 프로젝트 주소(/저장소이름/...)면 첫 경로 칸까지를, 자체 도메인이면 '/'를 처음 화면으로 봐요.
  (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    var base = /\.github\.io$/i.test(location.hostname) && seg.length ? '/' + seg[0] + '/' : '/';
    document.getElementById('home').setAttribute('href', base);
  })();
</script>
</body>
</html>
